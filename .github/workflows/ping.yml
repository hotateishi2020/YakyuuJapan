name: Ping APIs (multi-cron)

on:
  schedule:
    # JST 16:00–24:00 の毎時2分。NPB・MLB のチーム成績だけ。
    - cron: "2 7-15 * * *"
    # JST 16:00–24:00 の 30 分間隔。NPB・MLB の選手成績だけ。
    - cron: "13,43 7-15 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /fetchStatsTeamNPB
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '2 7-15 * * *' }}
        run: curl -fsS "https://yakyuujapan.onrender.com/fetchStatsTeamNPB"

      - name: Call /fetchStatsPlayerNPB
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '13,43 7-15 * * *' }}
        run: |
          curl --silent --show-error \
            --fail-with-body \
            --location \
            --retry 10 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1800 \
            --write-out "\nHTTP status: %{http_code}\n" \
            "https://yakyuujapan.onrender.com/fetchStatsPlayerNPB"

      - name: Call /fetchStatsTeamMLB
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '2 7-15 * * *' }}
        run: curl -fsS "https://yakyuujapan.onrender.com/fetchStatsTeamMLB" || true

      - name: Call /fetchStatsPlayerMLB
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '13,43 7-15 * * *' }}
        run: |
          curl --silent --show-error \
            --fail-with-body \
            --location \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1800 \
            "https://yakyuujapan.onrender.com/fetchStatsPlayerMLB" || true
