name: Ping APIs (multi-cron)

on:
  schedule:
    - cron: "2 7-15 * * *" # 毎日16時から24時の時間帯に毎時0分
    - cron: "13,43 7-15 * * *" # 毎日16時から24時の時間帯に30分間隔
    - cron: "9/10 4-15 * * *" # 毎日13時から24時の時間帯に10分間隔
    - cron: "15 15-21 * * *" # 毎日0時から6時の時間帯に毎時0分
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /fetchStatsTeamNPB (A)
        if: ${{ github.event.schedule == '2 7-15 * * *' }}
        run: curl -fsS "https://yakyuujapan.onrender.com/fetchStatsTeamNPB"
        
      - name: Call /fetchStatsPlayerNPB (B)
        if: ${{ github.event.schedule == '13,43 7-15 * * *' }}
        run: |
          curl --silent --show-error \
            --fail-with-body \
            --location \
            --retry 10 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1800 \
            --write-out "\nHTTP status: %{http_code}\n" \
            "https://yakyuujapan.onrender.com/fetchStatsPlayerNPB"

      - name: Call /fetchGamesNPB (C)
        if: ${{ github.event.schedule == '9/10 4-15 * * *' }}
        run: curl -fsS "https://yakyuujapan.onrender.com/fetchGamesNPB"

      - name: Call /fetchGamesNPB (D)
        if: ${{ github.event.schedule == '15 15-21 * * *' }}
        run: curl -fsS "https://yakyuujapan.onrender.com/fetchGamesNPB"