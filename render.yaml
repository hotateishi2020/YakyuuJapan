# Render Blueprint: ping.yml と同じ4本の定期実行。
# Web サービス (yakyuujapan) は既存のまま使い、Cron Job だけ追加する。
# Dashboard → Blueprints → New Blueprint Instance でこのファイルを適用する。
#
# 時刻はすべて UTC（JST = UTC+9）
services:
  # A: 毎日 16:02–24:02 JST に毎時、チーム成績を取得
  - type: cron
    name: koko-ping-stats-team
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.cron
    dockerContext: ./backend
    schedule: "2 7-15 * * *"
    plan: 0.5c-512mb
    envVars:
      - key: CRON_JOB
        value: stats-team
      - key: PING_BASE_URL
        value: https://yakyuujapan.onrender.com

  # B: 毎日 16:13/16:43–24:13/24:43 JST に選手成績を取得
  - type: cron
    name: koko-ping-stats-player
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.cron
    dockerContext: ./backend
    schedule: "13,43 7-15 * * *"
    plan: 0.5c-512mb
    envVars:
      - key: CRON_JOB
        value: stats-player
      - key: PING_BASE_URL
        value: https://yakyuujapan.onrender.com

  # C: 毎日 13:09–24:59 JST に10分間隔で試合を取得
  - type: cron
    name: koko-ping-games-day
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.cron
    dockerContext: ./backend
    schedule: "9,19,29,39,49,59 4-15 * * *"
    plan: 0.5c-512mb
    envVars:
      - key: CRON_JOB
        value: games
      - key: PING_BASE_URL
        value: https://yakyuujapan.onrender.com

  # D: 毎日 0:15–6:15 JST に毎時、試合を取得
  - type: cron
    name: koko-ping-games-night
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.cron
    dockerContext: ./backend
    schedule: "15 15-21 * * *"
    plan: 0.5c-512mb
    envVars:
      - key: CRON_JOB
        value: games
      - key: PING_BASE_URL
        value: https://yakyuujapan.onrender.com
