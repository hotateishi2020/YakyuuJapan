# Render Blueprint: 試合情報の定期取得だけを載せる。
# サービス名はダッシュボードの Cron Job と一致させる。
# 時刻はすべて UTC（JST = UTC+9）
services:
  # 毎日 13:00–24:59 JST に3分間隔で NPB の試合を取得
  - type: cron
    name: koko-fetch-games-day
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.cron
    dockerContext: .
    schedule: "*/3 4-15 * * *"
    plan: 0.5c-512mb
    envVars:
      - key: CRON_JOB
        value: games
      - key: PING_BASE_URL
        value: https://yakyuujapan.onrender.com

  # 毎日 13:00–24:59 JST に3分間隔で MLB の試合を取得（NPB の1分後）
  - type: cron
    name: koko-fetch-games-mlb-day
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.cron
    dockerContext: .
    schedule: "1-58/3 4-15 * * *"
    plan: 0.5c-512mb
    envVars:
      - key: CRON_JOB
        value: games-mlb
      - key: PING_BASE_URL
        value: https://yakyuujapan.onrender.com

  # 毎日 1:00–12:59 JST に3分間隔で MLB の試合を取得
  - type: cron
    name: koko-fetch-games-mlb-early
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.cron
    dockerContext: .
    schedule: "*/3 0-3,16-23 * * *"
    plan: 0.5c-512mb
    envVars:
      - key: CRON_JOB
        value: games-mlb
      - key: PING_BASE_URL
        value: https://yakyuujapan.onrender.com
