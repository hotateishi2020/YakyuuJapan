  <style>
    html, body, flutter-view, flt-glass-pane {
      overscroll-behavior-x: none;
    }
    body { margin: 0; }
    #startup-shell { position: fixed; inset: 0; z-index: 1000; background: white;
      color: #444; font: 14px Arial, sans-serif; padding-top: env(safe-area-inset-top); }
    #startup-header { height: 42px; padding: 0 8px; display: flex; align-items: center;
      background: linear-gradient(to right,#e10600,#ff9800); }
    #startup-brand { position: relative; overflow: hidden; width: 170.96px; height: 29.4px; transform: translateY(1.5px); }
    #startup-brand img { position: absolute; width: 185.84px; height: 61.89px; max-width: none; left: -11.07px; top: -14.88px; }
    #startup-navigation { display: flex; align-items: center; height: 40px;
      margin: 5px 8px 0; overflow-x: auto; white-space: nowrap;
      font-size: 13px; font-weight: 700; }
    .startup-picker, .startup-tab { height: 34px; box-sizing: border-box;
      flex: 0 0 auto; display: inline-flex; align-items: center;
      border-radius: 8px; white-space: nowrap; }
    .startup-picker { min-width: 110px; max-width: 220px; padding: 0 10px;
      color: white; background: var(--nav-color); }
    .startup-picker-label { overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .startup-picker::after { content: ''; margin-left: 10px;
      border-left: 5px solid transparent; border-right: 5px solid transparent;
      border-top: 5px solid white; }
    .startup-separator { flex: 0 0 auto; margin: 0 6px; }
    .startup-options { display: flex; flex: 0 0 auto; gap: 4px; }
    .startup-tab { justify-content: center; min-width: 48px; padding: 0 14px;
      background: var(--nav-pale); color: #222; }
    .startup-tab.selected { background: var(--nav-color); color: white; }
    #startup-navigation [hidden] { display: none; }
    #startup-status { text-align: center; padding: 40px 12px; color: #666; }

    main {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>

<body>
  <div id="startup-shell" aria-busy="true">
    <header id="startup-header"><span id="startup-brand"><img src="assets/backend/assets/images/logo_yakyuu_japan.png" alt="Yakyuu! Japan"></span></header>
    <nav id="startup-navigation" aria-label="階層ナビゲーション（起動中）"></nav>
    <div id="startup-status" role="status">読み込んでいます…</div>
  </div>
  <script>
    (() => {
      const shell = document.getElementById('startup-shell');
      const readSaved = name => {
        try {
          const cookie = document.cookie.split(';').map(v => v.trim()).find(v => v.startsWith(name + '='));
          return cookie ? decodeURIComponent(cookie.slice(name.length + 1)) : localStorage.getItem('koko_cookie_' + name);
        } catch (_) { return null; }
      };
      const orgs = [['home', '🏠HOME'], ['predict', '🎯予想対決'], ['npb', '🇯🇵NPB'], ['mlb', '🇺🇸MLB'], ['other', '⚾️その他']];
      const saved = readSaved('koko_org');
      const org = orgs.some(([value]) => value === saved) ? saved : 'npb';
      const color = org === 'npb' ? '#cb0115' : org === 'mlb' ? '#002d72' : '#000000';
      const pale = org === 'npb' ? '#f8dbde' : org === 'mlb' ? '#dbe2eb' : '#dbdbdb';
      shell.dataset.org = org;
      shell.style.setProperty('--nav-color', color);
      shell.style.setProperty('--nav-pale', pale);
      const navigation = document.getElementById('startup-navigation');
      const groups = [{labels: orgs, value: org}];
      if (org === 'npb' || org === 'mlb') {
        const labels = [
          ...(org === 'mlb' ? [['7', '🇯🇵日本人']] : []),
          ['0', '💥試合情報'], ['1', '⚾️チーム順位'], ['2', '🥇個人成績'],
          ['8', '🏆タイトル'], ['3', '💪戦力'], ['4', '📝記録'], ['6', '🎥動画'],
        ];
        const savedBoard = readSaved('koko_tab_main_' + org);
        groups.push({labels, value: labels.some(([value]) => value === savedBoard) ? savedBoard : '0'});
      } else if (org === 'other') {
        const value = readSaved('koko_tab_other_main') === '1' ? '1' : '0';
        groups.push({labels: [['0', '高校野球'], ['1', '国際シリーズ']], value});
      }
      const pickers = [];
      groups.forEach((group, index) => {
        if (index) {
          const separator = document.createElement('span');
          separator.className = 'startup-separator';
          separator.textContent = '>';
          navigation.append(separator);
        }
        const picker = document.createElement('span');
        picker.className = 'startup-picker';
        picker.dataset.level = index;
        const label = document.createElement('span');
        label.className = 'startup-picker-label';
        label.textContent = group.labels.find(([value]) => value === group.value)[1];
        picker.append(label);
        navigation.append(picker);
        pickers.push(picker);
      });
      const last = groups[groups.length - 1];
      const options = document.createElement('div');
      options.className = 'startup-options';
      last.labels.forEach(([value, label]) => {
        const tab = document.createElement('span');
        tab.className = 'startup-tab' + (value === last.value ? ' selected' : '');
        tab.textContent = label;
        options.append(tab);
      });
      navigation.append(options);
      const measure = document.createElement('span');
      measure.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;pointer-events:none';
      navigation.append(measure);
      const textWidth = text => { measure.textContent = text; return Math.ceil(measure.getBoundingClientRect().width); };
      const fitNavigation = () => {
        if (!shell.isConnected) return;
        const widths = groups.map(group => Math.min(220, Math.max(110, Math.max(...group.labels.map(([, label]) => textWidth(label))) + 56)));
        pickers.forEach((picker, index) => { picker.style.width = widths[index] + 'px'; });
        const optionWidths = last.labels.map(([, label]) => Math.max(48, textWidth(label) + 28));
        Array.from(options.children).forEach((tab, index) => { tab.style.width = optionWidths[index] + 'px'; });
        const required = widths.slice(0, -1).reduce((a, b) => a + b, 0) +
          (textWidth('>') + 12) * (groups.length - 1) + optionWidths.reduce((a, b) => a + b, 0) + (optionWidths.length - 1) * 4;
        const expanded = required <= navigation.clientWidth;
        pickers[pickers.length - 1].hidden = expanded;
        options.hidden = !expanded;
      };
      fitNavigation();
      document.fonts?.ready.then(fitNavigation);
      window.addEventListener('resize', fitNavigation);
      window.addEventListener('flutter-first-frame', () => { window.removeEventListener('resize', fitNavigation); shell.remove(); }, {once: true});
    })();
  </script>
  <main>
    <h1>Yakyuu! Japan — プロ野球とMLBの試合結果・順位表・個人成績</h1>
    <p>セ・リーグとパ・リーグ、メジャーリーグの試合日程、結果、予告先発を掲載しています。順位表では勝敗、ゲーム差、打率、本塁打、防御率まで並べ、ポストシーズンはクライマックスシリーズ、日本シリーズ、ワイルドカード、地区シリーズ、リーグ優勝決定シリーズ、ワールドシリーズの勝ち上がりを追えます。</p>
    <p>個人成績は打率、本塁打、打点、盗塁、出塁率、防御率、勝利、奪三振、ホールド、セーブなど。野球の数字をまとめて見たい人向けのサイトです。</p>
  </main>
